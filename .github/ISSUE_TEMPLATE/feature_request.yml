name: Feature idea
description: Suggest something that would make cooking with Say Chef better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help with?
      description: Describe the moment in the kitchen (or while browsing) where Say Chef falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other approaches you considered
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to build this myself
