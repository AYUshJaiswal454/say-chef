name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Dal Tadka
        2. Start hands-free cooking
        3. Say "start timer"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on Android 15
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Demo mode (no Firebase)
        - Firebase
        - Not sure
  - type: textarea
    id: voice
    attributes:
      label: For voice problems
      description: What you said, and what cooking mode showed it heard.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
